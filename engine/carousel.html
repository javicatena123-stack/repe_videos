<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2) format('woff2');}
html,body{margin:0;background:#111013}
#s{position:relative;width:1080px;height:1350px;overflow:hidden;background:#111013;color:#fff;font-family:Poppins}
.glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(254,89,77,.18) 0%,rgba(254,89,77,.06) 40%,rgba(254,89,77,0) 68%)}
.pill{position:absolute;left:80px;top:72px;background:#FE594D;border-radius:40px;padding:4px 26px 8px;font:800 40px Poppins;line-height:1}
.count{position:absolute;right:80px;top:80px;font:700 32px Poppins;color:#8d8794;letter-spacing:2px}
.anton{font-family:Anton;text-transform:uppercase;line-height:1.0;letter-spacing:.5px}
.coral{color:#FE594D}
.dots{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;gap:14px}
.dots i{display:block;width:14px;height:14px;border-radius:7px;background:#3a3640}
.dots i.on{width:44px;background:#FE594D}
.swipe{position:absolute;right:80px;bottom:56px;font:800 34px Poppins;color:#FE594D}
.handle{position:absolute;left:80px;bottom:58px;font:700 30px Poppins;color:#8d8794}
</style></head><body><div id="s"></div>
<script>
const CORAL="#FE594D";
const S=(inner)=>`<svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICONS={
 clock:()=>S(`<circle cx="100" cy="100" r="80"/><path d="M100 100 V52 M100 100 L134 120" stroke="${CORAL}" stroke-width="12"/><circle cx="100" cy="100" r="8" fill="#fff"/>`),
 sun:()=>S(`<path d="M24 150 H176"/><path d="M52 150 A48 48 0 0 1 148 150" fill="${CORAL}" stroke="${CORAL}"/><path d="M100 78 V52 M50 98 L34 82 M150 98 L166 82 M26 126 H10 M174 126 H190" stroke-width="8"/>`),
 moon:()=>S(`<path d="M128 34 C92 40 66 70 66 106 C66 146 98 176 138 176 C150 176 160 174 170 168 C116 160 88 102 128 34 Z" fill="${CORAL}" stroke="${CORAL}"/><path d="M44 52 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z" fill="#fff" stroke="none"/>`),
 coffee:()=>S(`<path d="M40 76 H140 V130 C140 156 120 174 90 174 C60 174 40 156 40 130 Z"/><path d="M140 92 H156 C170 92 172 124 156 124 H140"/><path d="M70 52 C62 40 78 32 70 18 M100 52 C92 40 108 32 100 18" stroke="${CORAL}"/>`),
 tupper:()=>S(`<rect x="28" y="84" width="144" height="80" rx="16"/><rect x="22" y="66" width="156" height="22" rx="8" fill="${CORAL}" stroke="${CORAL}"/><path d="M60 124 C70 106 90 106 98 124 M110 120 H146 M110 140 H140" stroke="#8d8794" stroke-width="7"/>`),
 crowd:()=>{let s="";[[46,1],[100,0],[154,1]].forEach(([x,b])=>{s+=`<circle cx="${x}" cy="${b?78:64}" r="${b?20:24}" ${b?"":`fill="${CORAL}" stroke="${CORAL}"`}/><path d="M${x-32} ${b?170:176} C${x-32} ${b?120:110} ${x+32} ${b?120:110} ${x+32} ${b?170:176}"/>`});return S(s);},
 calendar:()=>S(`<rect x="30" y="44" width="140" height="130" rx="14"/><path d="M30 80 H170"/><path d="M64 28 V56 M136 28 V56"/><rect x="112" y="112" width="34" height="34" rx="6" fill="${CORAL}" stroke="${CORAL}"/>`),
 dumbbell:()=>S(`<path d="M30 80 V120 M52 64 V136 M148 64 V136 M170 80 V120 M52 100 H148" stroke-width="13"/>`),
 battery:()=>S(`<rect x="26" y="62" width="132" height="76" rx="14"/><rect x="160" y="86" width="14" height="28" rx="4" fill="#fff"/><rect x="40" y="76" width="22" height="48" rx="5" fill="${CORAL}" stroke="none"/>`),
 snow:()=>S(`${[0,60,120].map(a=>`<path d="M100 26 V174" transform="rotate(${a} 100 100)"/><path d="M84 44 L100 60 L116 44 M84 156 L100 140 L116 156" transform="rotate(${a} 100 100)" stroke="${CORAL}" stroke-width="8"/>`).join("")}`),
 shirt:()=>S(`<path d="M70 30 L30 54 L44 92 L62 84 V172 H138 V84 L156 92 L170 54 L130 30 C124 46 112 54 100 54 C88 54 76 46 70 30 Z"/><path d="M84 110 C92 100 104 120 112 108 M80 140 C90 130 100 150 114 136" stroke="${CORAL}" stroke-width="7"/>`),
 thermo:()=>S(`<path d="M86 40 C86 24 114 24 114 40 V118 C130 128 136 146 128 162 C118 182 82 182 72 162 C64 146 70 128 86 118 Z"/><circle cx="100" cy="150" r="18" fill="${CORAL}" stroke="${CORAL}"/><path d="M100 140 V70" stroke="${CORAL}" stroke-width="12"/>`),
 legs:()=>S(`<path d="M70 30 V100 L56 176 M130 30 V100 L144 176"/><path d="M48 176 H76 M136 176 H164"/><path d="M60 70 l-14 -8 M62 90 l-16 0 M140 70 l14 -8 M138 90 l16 0" stroke="${CORAL}" stroke-width="7"/>`),
 chat:()=>S(`<path d="M30 40 H170 V136 H96 L60 168 V136 H30 Z"/><circle cx="70" cy="88" r="9" fill="${CORAL}" stroke="none"/><circle cx="100" cy="88" r="9" fill="${CORAL}" stroke="none"/><circle cx="130" cy="88" r="9" fill="${CORAL}" stroke="none"/>`),
};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function md(s){return esc(s).replace(/\*([^*]+)\*/g,'<span class="coral">$1</span>')}
function repeLogo(){const R=92,arc=(a0,a1)=>{const p=a=>[Math.cos(a)*R,Math.sin(a)*R];const[x0,y0]=p(a0),[x1,y1]=p(a1);return `M ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1}`};const d=x=>x*Math.PI/180;
 const head=deg=>{const a=d(deg),x=Math.cos(a)*R,y=Math.sin(a)*R,tx=-Math.sin(a),ty=Math.cos(a),nx=Math.cos(a),ny=Math.sin(a);return `M ${x+tx*34} ${y+ty*34} L ${x+nx*26} ${y+ny*26} L ${x-nx*26} ${y-ny*26} Z`};
 return `<svg viewBox="-150 -150 300 300" width="100%" height="100%"><circle r="150" fill="${CORAL}"/><path d="${arc(d(200),d(340))}" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/><path d="${arc(d(20),d(160))}" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/><path d="${head(340)}" fill="#fff"/><path d="${head(160)}" fill="#fff"/><circle r="26" fill="#fff"/><circle r="11" fill="${CORAL}"/></svg>`;}

window.renderSlide=(spec,i)=>{
  const n=spec.slides.length, sl=spec.slides[i], root=document.getElementById("s");
  const gx=[-300,-100,-500,-200,-400,-150,-350,-250][i%8], gy=[-200,100,-50,200,0,-150,150,-100][i%8];
  let h=`<div class="glow" style="left:${gx}px;top:${gy}px"></div><div class="pill">repe.</div><div class="count">${i+1}/${n}</div>`;
  if(sl.type==="cover"){
    h+=`<div style="position:absolute;left:80px;top:250px;width:920px" class="anton"><div style="font-size:150px">${md(sl.l1)}</div><div class="coral" style="font-size:190px;margin-top:6px">${md(sl.l2)}</div></div>
      <div style="position:absolute;right:80px;top:${sl.iconTop||760}px;width:340px;height:340px">${ICONS[sl.icon||"clock"]()}</div>
      <div style="position:absolute;left:80px;top:${sl.subTop||790}px;width:560px;font:700 44px/1.3 Poppins;color:#d9d4de">${md(sl.sub||"")}</div>`;
  } else if(sl.type==="item"){
    h+=`<div style="position:absolute;right:80px;top:190px;width:300px;height:300px">${ICONS[sl.icon]()}</div>
      <div class="anton coral" style="position:absolute;left:80px;top:200px;font-size:230px">${esc(sl.time)}</div>
      <div class="anton" style="position:absolute;left:80px;top:500px;width:920px;font-size:${sl.titleSize||118}px">${md(sl.title)}</div>
      <div style="position:absolute;left:80px;top:${sl.textTop||(sl.titleSize&&sl.titleSize<110?820:780)}px;width:910px;font:700 56px/1.36 Poppins;color:#e6e1ea">${md(sl.text)}</div>`;
  } else if(sl.type==="cta"){
    h+=`<div style="position:absolute;left:390px;top:200px;width:300px;height:300px">${repeLogo()}</div>
      <div class="anton" style="position:absolute;left:60px;right:60px;top:560px;text-align:center;font-size:160px">${md(sl.l1)}</div>
      <div class="anton" style="position:absolute;left:60px;right:60px;top:725px;text-align:center;font-size:160px">${md(sl.l2||"")}</div>
      <div style="position:absolute;left:100px;right:100px;top:950px;text-align:center;font:700 50px/1.38 Poppins;color:#e6e1ea">${md(sl.text)}</div>`;
  }
  h+=`<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>`;
  if(i<n-1) h+=`<div class="swipe">desliza →</div>`;
  h+=`<div class="handle">${esc(spec.handle||"")}</div>`;
  root.innerHTML=h; return true;
};
</script></body></html>
