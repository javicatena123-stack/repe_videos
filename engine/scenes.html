<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2) format('woff2');}
@font-face{font-family:Poppins;font-weight:900;src:url(fonts/poppins-latin-900-normal.woff2) format('woff2');}
html,body{margin:0;padding:0;background:#111013;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#111013;font-family:Poppins,sans-serif;color:#fff;}
#glow{position:absolute;width:1500px;height:1500px;border-radius:50%;
  background:radial-gradient(circle, rgba(254,89,77,0.18) 0%, rgba(254,89,77,0.06) 38%, rgba(254,89,77,0) 68%);left:-210px;top:0;}
#bgp{position:absolute;left:0;top:0;width:1080px;height:1920px}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#FE594D;opacity:0;mix-blend-mode:screen}
#bar{position:absolute;left:0;top:0;height:10px;background:#FE594D;width:0}
#barbg{position:absolute;left:0;top:0;height:10px;width:1080px;background:#26232a}
#pill{position:absolute;left:50%;top:205px;transform:translateX(-50%);background:#FE594D;color:#fff;border-radius:40px;
  padding:6px 30px 10px;font:800 44px Poppins;letter-spacing:-0.5px;line-height:1}
#vis{position:absolute;left:0;top:330px;width:1080px;height:880px;transform-origin:50% 45%}
#fx{position:absolute;left:0;top:0;width:1080px;height:880px;overflow:visible;pointer-events:none}
#sub{position:absolute;left:60px;right:60px;top:1235px;text-align:center;font:800 66px/1.18 Poppins;letter-spacing:-0.5px;
  text-shadow:0 4px 18px rgba(0,0,0,.6)}
#sub .w{display:inline-block;opacity:0;transform-origin:50% 80%}
#sub .w.b{color:#FE594D}
.anton{font-family:Anton;font-weight:400;line-height:1.02;letter-spacing:0.5px;text-transform:uppercase}
.ch{display:inline-block;transform-origin:50% 80%}
.card{position:absolute;background:#1c1a20;border:3px solid #2e2a33;border-radius:34px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.lbl{font:700 40px Poppins;color:#a7a2ad;letter-spacing:3px;text-transform:uppercase}
.coral{color:#FE594D}
.abs{position:absolute}
#stage.inv{background:#FE594D}
#stage.inv #glow{opacity:0} #stage.inv #bgp{opacity:.35} #stage.inv #pill{background:#111013} #stage.inv #bar{background:#111013}
#stage.inv #barbg{background:rgba(17,16,19,.25)} #stage.inv #sub{text-shadow:none} #stage.inv #sub .w.b{color:#111013}
</style></head>
<body><div id="stage"><div id="glow"></div><svg id="bgp" viewBox="0 0 1080 1920"></svg><div id="barbg"></div><div id="bar"></div><div id="pill">repe.</div>
<div id="vis"></div><div id="sub"></div><div id="flash"></div></div>
<script src="toni.js"></script>
<script>
const NS="http://www.w3.org/2000/svg";
const CORAL="#FE594D", WHITE="#ffffff", GREY="#5a5560", DARK="#111013", BLUE="#8fd0ff", PINK="#ffd6d2";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const easeIn=x=>Math.pow(clamp(x),3);
const easeInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const elastic=x=>{x=clamp(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const pop=(t,d=0,dur=.38)=>back((t-d)/dur);
const fade=(t,d=0,dur=.25)=>easeOut((t-d)/dur);
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const wob=(t,f=1,a=1,ph=0)=>a*Math.sin(t*f*2*Math.PI+ph);
function invEIO(y){let lo=0,hi=1;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(easeInOut(m)<y)lo=m;else hi=m;}return (lo+hi)/2;}
const noise=(t,s=0)=>(Math.sin(t*7.1+s)+Math.sin(t*13.7+s*2.3)*.6+Math.sin(t*23.3+s*4.1)*.35)/1.95;
let UID=0;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function q(r,k){return r.querySelector(`[data-k="${k}"]`)}
function qa(r,k){return [...r.querySelectorAll(`[data-k="${k}"]`)]}
function tf(e,s){if(e)e.setAttribute("transform",s)}
function at(e,o){if(e)for(const k in o)e.setAttribute(k,o[k])}
const SVG=(inner,vb="0 0 200 200")=>`<svg viewBox="${vb}" width="100%" height="100%" overflow="visible" xmlns="${NS}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
/* split text into popping letters */
function chars(s){return [...String(s)].map(c=>c===" "?" ":`<span class="ch">${esc(c)}</span>`).join("")}
function popChars(nodes,t,d=0,step=.028,dur=.3){nodes.forEach((n,i)=>{const k=t-d-i*step;const s=pop(k,0,dur);
  n.style.opacity=clamp(k/.06);n.style.transform=`translateY(${(1-easeOut(k/dur))*40}px) rotate(${(1-easeOut(k/dur))*-14}deg) scale(${s})`;});}

/* ================================================================ FX: bursts, shakes, flash */
let BURSTS=[],SHAKES=[],FLASH=[],FXN=[];
function burst(o){BURSTS.push(Object.assign({x:540,y:440,t0:0,n:18,speed:620,life:.75,grav:1300,size:12,colors:[CORAL,WHITE],
  seed:BURSTS.length*7+3,shape:"dot",spread:Math.PI*2,dir:-Math.PI/2},o));}
function shake(t0,dur=.3,amp=14){SHAKES.push({t0,dur,amp});}
function flash(t0,a=.18){FLASH.push({t0,a});}
function fxInit(){const s=document.createElementNS(NS,"svg");s.id="fx";s.setAttribute("viewBox","0 0 1080 880");s.setAttribute("overflow","visible");
  FXN=[];for(let i=0;i<220;i++){const r=document.createElementNS(NS,"rect");r.setAttribute("opacity","0");s.appendChild(r);FXN.push(r);} $("#vis").appendChild(s);}
function fxDraw(t){let k=0;
  for(const b of BURSTS){const dt=t-b.t0;if(dt<0||dt>b.life)continue;
    for(let i=0;i<b.n&&k<FXN.length;i++){const r1=rnd(b.seed*101+i),r2=rnd(b.seed*211+i),r3=rnd(b.seed*307+i);
      const ang=b.dir+(r1-.5)*b.spread, sp=b.speed*(.35+.8*r2), drag=Math.exp(-dt*1.6);
      const x=b.x+Math.cos(ang)*sp*dt*drag, y=b.y+Math.sin(ang)*sp*dt*drag+.5*b.grav*dt*dt;
      const a=Math.pow(1-dt/b.life,.8), n=FXN[k++], col=b.colors[i%b.colors.length];
      let w=b.size*(.6+.8*r3), h=w, rx=w/2, rot=0;
      if(b.shape==="conf"){h=w*.5;rx=2;rot=dt*900*(r3-.5)+r1*180;}
      if(b.shape==="spark"){w=b.size*2.6*(1-dt/b.life)+4;h=5;rx=2.5;rot=Math.atan2(Math.sin(ang)*sp+b.grav*dt,Math.cos(ang)*sp)*180/Math.PI;}
      at(n,{x:-w/2,y:-h/2,width:w,height:h,rx,fill:col,opacity:a,transform:`translate(${x} ${y}) rotate(${rot})`});}}
  for(;k<FXN.length;k++)FXN[k].setAttribute("opacity","0");}
function shakeAt(t){let x=0,y=0,r=0;for(const s of SHAKES){const dt=t-s.t0;if(dt<0||dt>s.dur)continue;const a=s.amp*Math.pow(1-dt/s.dur,2);
  x+=a*Math.sin(dt*95);y+=a*Math.cos(dt*83);r+=a*.08*Math.sin(dt*70);}return {x,y,r};}

/* ================================================================ background particles */
const BGN=[];
function bgInit(){const s=$("#bgp");for(let i=0;i<26;i++){const g=document.createElementNS(NS,"g");
  const plus=rnd(i+.5)>.55;g.innerHTML=plus?`<path d="M-9 0 H9 M0 -9 V9" stroke="${rnd(i+9)>.5?CORAL:"#fff"}" stroke-width="4" stroke-linecap="round"/>`
    :`<circle r="${3+rnd(i+3)*5}" fill="${rnd(i+7)>.6?CORAL:"#fff"}"/>`;s.appendChild(g);BGN.push(g);}}
function bgDraw(gt){BGN.forEach((g,i)=>{const sp=25+rnd(i+11)*55, x0=rnd(i+1)*1080, y=1920-((rnd(i+2)*1920+gt*sp)%2000)+40;
  const x=x0+30*Math.sin(gt*.6+i);g.setAttribute("transform",`translate(${x} ${y}) rotate(${gt*40*(rnd(i+4)-.5)})`);
  g.setAttribute("opacity",(.10+rnd(i+5)*.22).toFixed(3));});}

/* ================================================================ animated icons (200x200) */
const AN={};
function placeIcon(box,name,p={},d=0){const f=AN[name]||AN._generic;const o=f(p,name);box.innerHTML=o.html;if(o.init)o.init.call(o,box);return t=>o.upd.call(o,Math.max(0,t-d));}

AN._generic=(p,name)=>({html:SVG(`<g data-k="g">${(STATIC[name]||STATIC.check)(p)}</g>`),init(r){this.g=q(r,"g")},
  upd(t){const s=pop(t,0,.4);tf(this.g,`translate(100 100) rotate(${wob(t,.7,6)}) scale(${s}) translate(-100 ${-100+wob(t,1.1,6)})`)}});

AN.drumstick=p=>({html:SVG(`<g data-k="g"><path d="M104 104 L58 150" stroke-width="18"/><circle cx="46" cy="148" r="14" fill="#fff" stroke="none"/><circle cx="60" cy="164" r="14" fill="#fff" stroke="none"/>
   <ellipse cx="132" cy="74" rx="56" ry="44" transform="rotate(-40 132 74)" fill="${CORAL}" stroke="${CORAL}"/><path d="M112 58 C122 44 140 40 152 46" stroke="#fff" stroke-width="7" opacity=".7"/></g>
   <g data-k="sh">${[0,1,2].map(i=>`<path d="M${158+i*14} ${30-i*8} l9 -16" stroke="${CORAL}" stroke-width="6"/>`).join("")}</g>`),
  init(r){this.g=q(r,"g");this.sh=q(r,"sh")},
  upd(t){const s=pop(t,0,.4);const hop=Math.abs(Math.sin(t*4.2))*-22;const sq=1+.07*Math.cos(t*8.4);
    tf(this.g,`translate(100 170) rotate(${wob(t,.6,10)}) scale(${s*sq} ${s*(2-sq)}) translate(-100 ${-170+hop})`);
    at(this.sh,{opacity:(.4+.6*Math.abs(Math.sin(t*6))).toFixed(2)});tf(this.sh,`translate(0 ${hop*.5})`)}});

AN.toilet=p=>{const id="tc"+(UID++);const drops=[...Array(8)].map((_,i)=>`<circle data-k="dr" r="${4+rnd(i)*4}" fill="${BLUE}" stroke="none" opacity="0"/>`).join("");
 const items=[0,1,2].map(i=>`<g data-k="it"><rect x="-13" y="-13" width="26" height="26" rx="6" fill="${CORAL}" stroke="none"/><path d="M-6 0 H6 M0 -6 V6" stroke="#fff" stroke-width="4"/></g>`).join("");
 return {html:SVG(`<defs><clipPath id="${id}"><path d="M46 102 H154 C152 136 128 154 100 154 C72 154 48 136 46 102 Z"/></clipPath></defs>
   <g data-k="body"><rect x="44" y="18" width="56" height="74" rx="8"/><g data-k="hd"><rect x="98" y="34" width="22" height="9" rx="4" fill="#fff" stroke="none"/></g>
   <path d="M40 98 H160 C160 140 132 160 100 160 C68 160 40 140 40 98 Z"/><path d="M76 160 L72 186 H128 L124 160"/>
   <g clip-path="url(#${id})"><ellipse data-k="w1" cx="100" cy="122" rx="46" ry="16" stroke="${BLUE}" stroke-width="6" stroke-dasharray="26 16"/>
   <ellipse data-k="w2" cx="100" cy="124" rx="26" ry="9" stroke="${CORAL}" stroke-width="5" stroke-dasharray="14 10"/>${items}</g></g>${drops}`),
  init(r){this.body=q(r,"body");this.hd=q(r,"hd");this.w1=q(r,"w1");this.w2=q(r,"w2");this.it=qa(r,"it");this.dr=qa(r,"dr")},
  upd(t){const s=pop(t,0,.4);const fl=clamp((t-.45)/1.6);const shk=t>.45&&t<1.3?wob(t,9,2.2):0;
    tf(this.body,`translate(100 186) scale(${s}) rotate(${shk}) translate(-100 -186)`);
    tf(this.hd,`rotate(${t>.4&&t<.9?28:0} 100 38)`);
    const spin=1+fl*5;at(this.w1,{"stroke-dashoffset":(-t*160*spin).toFixed(1)});at(this.w2,{"stroke-dashoffset":(t*220*spin).toFixed(1)});
    this.it.forEach((g,i)=>{const t0=.15+i*.28, k=t-t0;let x=100,y=-80,sc=1,rt=0,op=1;
      if(k<0){op=0}else if(k<.32){y=lerp(-60,118,easeIn(k/.32));rt=k*400}else{const u=clamp((k-.32)/1.1);const a=u*12+i*2;const rr=40*(1-u);
        x=100+Math.cos(a)*rr;y=122+Math.sin(a)*rr*.35;sc=1-u;rt=u*900;op=1-u*.6}
      tf(g,`translate(${x} ${y}) rotate(${rt}) scale(${Math.max(sc,0.001)})`);g.setAttribute("opacity",op)});
    this.dr.forEach((c,i)=>{const t0=.47+(i%3)*.28, dt=t-t0;if(dt<0||dt>.6){c.setAttribute("opacity","0");return}
      const ang=-Math.PI/2+(rnd(i+3)-.5)*2.2, sp=180+rnd(i+5)*140;
      at(c,{cx:100+Math.cos(ang)*sp*dt,cy:112+Math.sin(ang)*sp*dt+.5*700*dt*dt,opacity:(1-dt/.6).toFixed(2)})})}}};

AN.shaker=p=>{const id="sc"+(UID++);const puffs=[...Array(7)].map(()=>`<circle data-k="pf" r="6" fill="#fff" stroke="none"/>`).join("");
 return {html:SVG(`<defs><clipPath id="${id}"><path d="M60 54 H140 L129 178 H71 Z"/></clipPath></defs><g data-k="g">
   <rect data-k="lid" x="62" y="18" width="76" height="26" rx="6" fill="${CORAL}" stroke="${CORAL}"/>
   <g clip-path="url(#${id})"><path data-k="liq" d="M40 120 Q100 110 160 120 V200 H40 Z" fill="${CORAL}" opacity=".3" stroke="none"/></g>
   <path d="M56 50 H144 L132 182 H68 Z"/>
   <text x="100" y="${p.small?132:128}" text-anchor="middle" font-family="Anton" font-size="${p.small?40:46}" fill="${CORAL}" stroke="none">${esc(p.text||"")}</text></g>${puffs}`),
  init(r){this.g=q(r,"g");this.liq=q(r,"liq");this.pf=qa(r,"pf");this.lid=q(r,"lid")},
  upd(t){const s=pop(t,0,.4);const I=p.intense?1.6:1;let env=.55+.45*Math.max(0,Math.sin(t*2.4));
    if(p.hit!==undefined){const dh=t-p.hit;env=dh<0?.25:(dh<.5?1.8*(1-dh/.5)+.3:.3)}
    const rot=9*I*env*Math.sin(t*26), dy=4*I*env*Math.sin(t*52);
    tf(this.g,`translate(100 182) rotate(${rot}) scale(${s}) translate(-100 ${-182+dy})`);
    const sl=rot*1.6;at(this.liq,{d:`M40 ${120+sl} Q100 ${112-sl*.3} 160 ${120-sl} V200 H40 Z`});
    tf(this.lid,`translate(0 ${-Math.abs(Math.sin(t*26))*3*env})`);
    this.pf.forEach((c,i)=>{const ph=(t*1.1+i/7)%1;at(c,{cx:100+(rnd(i)-.5)*90*ph+rot*.8,cy:14-ph*70,r:4+ph*9,opacity:((1-ph)*.55*env).toFixed(2)})})}}};

AN.paper=p=>({html:SVG(`<g data-k="pg"><path d="M50 18 H126 L154 46 V182 H50 Z" fill="#1c1a20"/><path d="M126 18 V46 H154"/>
   ${[80,104,128].map((y,i)=>`<path data-k="ln" d="M70 ${y} H${i==2?112:134}" stroke="#8d8794" stroke-dasharray="70" stroke-dashoffset="70"/>`).join("")}
   <g data-k="yr"><text x="102" y="170" text-anchor="middle" font-family="Anton" font-size="34" fill="${CORAL}" stroke="none">${esc(p.text||"2023")}</text></g></g>
   <g data-k="mg"><circle cx="0" cy="0" r="26" stroke="${CORAL}" stroke-width="8" fill="rgba(254,89,77,.15)"/><path d="M19 19 L42 42" stroke="${CORAL}" stroke-width="11"/></g>`),
  init(r){this.pg=q(r,"pg");this.ln=qa(r,"ln");this.yr=q(r,"yr");this.mg=q(r,"mg")},
  upd(t){const s=pop(t,0,.45);tf(this.pg,`translate(100 100) rotate(${(1-easeOut(t/.5))*-25+wob(t,.5,2)}) scale(${s}) translate(-100 -100)`);
    this.ln.forEach((l,i)=>l.setAttribute("stroke-dashoffset",(70*(1-easeOut((t-.25-.2*i)/.3))).toFixed(1)));
    tf(this.yr,`translate(102 158) scale(${pop(t,.85,.35)}) rotate(${-8*fade(t,.85)}) translate(-102 -158)`);
    const k=fade(t,.3,.3);tf(this.mg,`translate(${96+44*Math.sin(t*2.6)} ${96+26*Math.sin(t*1.7)}) scale(${k})`)}});

AN.check=p=>({html:SVG(`<g data-k="ry">${[...Array(10)].map((_,i)=>{const a=i/10*Math.PI*2;return `<path d="M${100+Math.cos(a)*84} ${104+Math.sin(a)*84} L${100+Math.cos(a)*104} ${104+Math.sin(a)*104}" stroke="${i%2?"#fff":CORAL}" stroke-width="8"/>`}).join("")}</g>
   <path data-k="ck" d="M40 104 L82 146 L162 58" stroke="${CORAL}" stroke-width="22" stroke-dasharray="210" stroke-dashoffset="210"/>`),
  init(r){this.ck=q(r,"ck");this.ry=q(r,"ry")},
  upd(t){this.ck.setAttribute("stroke-dashoffset",(210*(1-easeOut(t/.32))).toFixed(1));const k=clamp((t-.3)/.45);
    tf(this.ry,`translate(100 104) scale(${.6+.8*easeOut(k)}) translate(-100 -104)`);this.ry.setAttribute("opacity",k>0&&k<1?(1-k).toFixed(2):"0");
    tf(this.ck,`translate(100 104) scale(${t>.32?1+.06*Math.sin((t-.32)*7):1}) translate(-100 -104)`)}});

AN.cross=p=>({html:SVG(`<g data-k="g"><path data-k="a" d="M46 46 L154 154" stroke="${CORAL}" stroke-width="22" stroke-dasharray="155" stroke-dashoffset="155"/>
   <path data-k="b" d="M154 46 L46 154" stroke="${CORAL}" stroke-width="22" stroke-dasharray="155" stroke-dashoffset="155"/></g>`),
  init(r){this.g=q(r,"g");this.a=q(r,"a");this.b=q(r,"b")},
  upd(t){this.a.setAttribute("stroke-dashoffset",(155*(1-easeOut(t/.18))).toFixed(1));this.b.setAttribute("stroke-dashoffset",(155*(1-easeOut((t-.16)/.18))).toFixed(1));
    const dt=t-.34;const sh=dt>0&&dt<.4?14*(1-dt/.4)*Math.sin(dt*60):0;tf(this.g,`translate(${sh} 0) rotate(${sh*.4} 100 100)`)}});

AN.calendar=p=>({html:SVG(`<g data-k="g"><rect x="30" y="44" width="140" height="130" rx="14" fill="#1c1a20"/><path d="M30 80 H170"/>
   <rect data-k="pg" x="36" y="84" width="128" height="84" rx="8" fill="#26232a" stroke="none"/>
   <path d="M64 28 V56 M136 28 V56"/><rect data-k="sq" x="112" y="112" width="34" height="34" rx="6" fill="${CORAL}" stroke="${CORAL}"/></g>`),
  init(r){this.g=q(r,"g");this.pg=q(r,"pg");this.sq=q(r,"sq")},
  upd(t){const s=pop(t,0,.4);tf(this.g,`translate(100 110) rotate(${wob(t,.6,5)}) scale(${s}) translate(-100 -110)`);
    const ph=(t*1.6)%1;tf(this.pg,`translate(0 84) scale(1 ${Math.cos(ph*Math.PI)}) translate(0 -84)`);this.pg.setAttribute("opacity",ph<.5?.9:.5);
    const k=Math.floor(t*1.6);const pos=[[112,112],[52,112],[82,96],[112,96]][k%4];
    at(this.sq,{x:pos[0],y:pos[1]});tf(this.sq,`translate(${pos[0]+17} ${pos[1]+17}) scale(${back(ph/.35)}) translate(${-pos[0]-17} ${-pos[1]-17})`)}});

AN.plate=p=>({html:SVG(`<g data-k="st">${[0,1,2].map(i=>`<path data-k="s" d="" stroke="#fff" stroke-width="6" opacity=".6"/>`).join("")}</g>
   <g data-k="g"><ellipse cx="100" cy="118" rx="84" ry="44"/><ellipse cx="100" cy="114" rx="56" ry="27" stroke="#8d8794" stroke-width="6"/>
   <path data-k="fd" d="M70 108 C76 86 96 84 102 100 C108 82 130 86 132 106" stroke="${CORAL}" stroke-width="10"/></g>`),
  init(r){this.g=q(r,"g");this.s=qa(r,"s");this.fd=q(r,"fd")},
  upd(t){const s=pop(t,0,.4);tf(this.g,`translate(100 140) scale(${s}) rotate(${wob(t,.5,3)}) translate(-100 -140)`);
    tf(this.fd,`translate(100 104) scale(${1+.08*Math.sin(t*7)} ${1-.08*Math.sin(t*7)}) translate(-100 -104)`);
    this.s.forEach((pth,i)=>{const ph=(t*.8+i/3)%1;const x=78+i*22,y0=78-ph*70;let d=`M${x} ${y0}`;for(let j=1;j<=4;j++){d+=` Q${x+(j%2?10:-10)} ${y0-j*8+4} ${x} ${y0-j*8}`}
      at(pth,{d,opacity:(Math.sin(ph*Math.PI)*.7*s).toFixed(2)})})}});

AN.crystals=p=>{const frag=[...Array(14)].map(()=>`<path data-k="fr" d="M0 -9 L7 6 L-7 6 Z" fill="${CORAL}" stroke="none" opacity="0"/>`).join("");
 return {html:SVG(`<path data-k="band" d="" stroke="${PINK}" stroke-width="10"/>
   <g data-k="cs">${[[40,62,80,150],[86,112,134,150],[138,156,170,150]].map(([a,b,c,y],i)=>`<g data-k="c"><path d="M${a} ${y} L${b} ${[60,30,80][i]} L${c} ${y} Z" fill="${CORAL}" stroke="${CORAL}" stroke-width="6"/>
   <path data-k="gl" d="M${b} ${[60,30,80][i]+14} L${b+6} ${y-14}" stroke="#fff" stroke-width="5" opacity=".0"/></g>`).join("")}</g>${frag}`),
  init(r){this.band=q(r,"band");this.c=qa(r,"c");this.gl=qa(r,"gl");this.fr=qa(r,"fr");this.cs=q(r,"cs")},
  upd(t){const sh=p.shatterAt;const broke=sh!==undefined&&t>sh;
    const hitPh=(t*2.2)%1, hit=Math.max(0,1-hitPh*4);
    let d="M18 156";for(let x=18;x<=182;x+=8){d+=` L${x} ${156+(broke?0:hit*6*Math.sin((x-100)/14))}`}at(this.band,{d});
    this.c.forEach((g,i)=>{const k=easeOut((t-.08-i*.12)/.35);const jab=broke?0:-hit*10*(i%2?1:.7);
      tf(g,`translate(0 ${150+jab}) scale(1 ${Math.max(k,0.001)}) translate(0 -150)`);g.setAttribute("opacity",broke?Math.max(0,1-(t-sh)*6):1)});
    this.gl.forEach((g,i)=>{const ph=(t*.9+i*.3)%1;g.setAttribute("opacity",(ph<.3?Math.sin(ph/.3*Math.PI):0).toFixed(2))});
    this.fr.forEach((f,i)=>{if(!broke){f.setAttribute("opacity","0");return}const dt=t-sh;const ang=-Math.PI/2+(rnd(i+2)-.5)*2.6,sp=260+rnd(i+6)*320;
      const x=40+rnd(i+9)*120+Math.cos(ang)*sp*dt,y=110+Math.sin(ang)*sp*dt+600*dt*dt;
      at(f,{transform:`translate(${x} ${y}) rotate(${dt*700*(rnd(i)-.5)}) scale(${.8+rnd(i+1)*1.2})`,opacity:Math.max(0,1-dt/.9).toFixed(2)})})}}};

AN.fibers=p=>{const N=5;let h="";for(let i=0;i<N;i++){const y=48+i*26,col=i%2?PINK:"#fff";

    this.cell=qa(r,"cell");this.pl=qa(r,"pl")},
  upd(t){const rep=!!p.repair;for(let i=0;i<N;i++){const torn=i%2===0;const y=48+i*26;const x0=100+(i-2)*8;
      let gap=0;if(torn){gap=rep?18*(1-easeInOut((t-.3)/.8)):6+18*easeOut((t-.25-i*.06)/.35)+(t>.6?2*Math.sin(t*14+i):0)}
      const st=rep?0:2*Math.sin(t*9+i);
      at(this.L[i],{d:`M${22-st} ${y} H${x0-gap/2}`});at(this.R[i],{d:`M${x0+gap/2} ${y} H${178+st}`});
      const show=torn&&(rep?gap>2:t>.25);const fl=Math.abs(Math.sin(t*16+i));
      this.tr[i].setAttribute("opacity",show?(rep?gap/18:.5+.5*fl).toFixed(2):"0");tf(this.tr[i],`translate(${x0} ${y}) scale(${rep?.8:1+.2*fl})`)}

function el(html,css){const d=document.createElement("div");d.className="abs";d.style.cssText=css||"";d.innerHTML=html;$("#vis").insertBefore(d,$("#fx"));return d;}

KINDS.num=(p)=>{const H=p.height||360;
  const card=el(`<div class="card" style="left:0;top:0;width:860px;height:${H}px"></div>
    <div class="abs" data-r="ic" style="left:40px;top:${(H-260)/2}px;width:260px;height:260px"></div>

    <div class="abs anton coral" data-r="nv" style="left:326px;top:118px;font-size:200px;white-space:nowrap;transform-origin:20% 70%">0</div>
    <div class="abs" data-r="rg" style="left:430px;top:110px;width:200px;height:200px;border-radius:50%;border:8px solid ${CORAL};opacity:0"></div>`,
    "left:110px;top:270px;width:860px;height:360px;transform-origin:50% 60%");
  const ic=placeIcon(card.querySelector('[data-r=ic]'),p.icon,p.iconp,.1);
  const nv=card.querySelector('[data-r=nv]'),rg=card.querySelector('[data-r=rg]'),lb=[...card.querySelectorAll('[data-r=lb] .ch')];
  const done=.78;burst({x:620,y:470,t0:done,n:22,speed:700,colors:[CORAL,WHITE,PINK]});
  return t=>{card.style.transform=`perspective(1400px) rotateX(${(1-easeOut(t/.5))*40}deg) rotateY(${wob(t,.3,5)}deg) translateY(${wob(t,.45,8)}px) scale(${pop(t,0,.45)})`;
    card.style.opacity=fade(t,0,.12);ic(t);popChars(lb,t,.15,.018,.22);
    const k=easeOut((t-.12)/(done-.12));const v=p.count===false?p.value:Math.round(p.value*k);
    const bump=t<done?1+.07*Math.abs(Math.sin(v*1.3)):1+.12*Math.max(0,1-(t-done)/.25)*Math.sin((t-done)*30);
    nv.innerHTML=`${p.prefix||""}${v}<span style="font-size:96px;margin-left:12px">${esc(p.unit||"")}</span>`;nv.style.transform=`scale(${bump})`;
    const rk=clamp((t-done)/.5);rg.style.opacity=rk>0&&rk<1?(1-rk):0;rg.style.transform=`scale(${.5+1.3*rk})`;}};

KINDS.head=(p)=>{const lines=p.lines||[];const fs=p.size||150;
  const top=p.icon?60:Math.max(60,330-lines.length*fs*0.55);

  if(p.badge)html+=`<div class="abs anton" data-r="bd" style="left:470px;top:${top-150}px;width:140px;height:140px;border-radius:50%;background:${CORAL};display:flex;align-items:center;justify-content:center;font-size:96px;transform-origin:50% 50%">${esc(p.badge)}</div>`;
  lines.forEach((l,i)=>{html+=`<div class="abs anton ln" style="left:30px;right:30px;top:${top+i*fs*1.04}px;text-align:center;font-size:${fs}px;color:${(p.coral||[]).includes(i)?CORAL:WHITE};transform-origin:50% 60%">${chars(l)}</div>`;});
  if(p.strike!==undefined){const y=top+p.strike*fs*1.04+fs*0.56;html+=`<div class="abs" data-r="st" style="left:110px;top:${y}px;height:20px;width:860px;background:${CORAL};border-radius:10px;transform-origin:0 50%;transform:scaleX(0)"></div>`;}
  const isz=p.iconSize||300, itop=top+lines.length*fs*1.04+30;
  if(p.icon)html+=`<div class="abs" data-r="ic" style="left:${540-isz/2}px;top:${itop}px;width:${isz}px;height:${isz}px"></div>`;
  if(p.mark)html+=`<div class="abs" data-r="mk" style="left:${540+isz/2-120}px;top:${itop+isz-170}px;width:200px;height:200px"></div>`;
  const box=el(html,"left:0;top:0;width:1080px;height:880px");
  const lns=[...box.querySelectorAll(".ln")],chs=lns.map(l=>[...l.querySelectorAll(".ch")]);
  const bdg=box.querySelector('[data-r=bd]'),st=box.querySelector('[data-r=st]');
  const icd=.1+.05*lines.join("").length*.4;
  const ic=p.icon?placeIcon(box.querySelector('[data-r=ic]'),p.icon,p.iconp,Math.min(icd,.45)):null;
  const ma=p.markAt??.6;const mk=p.mark?placeIcon(box.querySelector('[data-r=mk]'),p.mark,{},ma):null;
  const sa=p.strikeAt??.45;
  if(p.strike!==undefined){shake(sa+.22,.3,12);burst({x:540,y:top+p.strike*fs*1.04+fs*.6,t0:sa+.22,n:16,shape:"spark",speed:600,grav:300,life:.5});}
  if(p.mark==="cross"){shake(ma+.34,.3,10);}
  if(p.mark==="check"){burst({x:540+isz/2-20,y:itop+isz-70,t0:ma+.32,n:14,colors:[CORAL,WHITE],speed:520});}
  let n=0;
  return t=>{chs.forEach((c,i)=>{popChars(c,t,i*.08,.03,.3);
      if(p.strike===i&&t>sa+.45){c.forEach((n,j)=>{const k=t-sa-.45-j*.04;if(k<=0)return;const dy=Math.min(70,260*k*k)+4*Math.sin(t*9+j),r=(rnd(j+3)-.5)*50*easeOut(k/.6);
        n.style.transform=`translateY(${dy}px) rotate(${r}deg)`;n.style.opacity=Math.max(.35,1-k*.5);});}});
    lns.forEach((l,i)=>{const struck=p.strike===i&&t>sa+.22;l.style.transform=`translateY(${wob(t,.5,6,i)}px) rotate(${wob(t,.35,1.2,i*2)}deg)`;
      if(p.strike===i)l.style.color=struck?`rgba(255,255,255,${(1-.55*fade(t,sa+.22,.3)).toFixed(2)})`:WHITE;});
    if(bdg)setT(bdg,{s:pop(t,0,.35)*(1+.05*Math.sin(t*6)),r:(1-fade(t,0,.35))*-180});

KINDS.bars=(p)=>{const DT=p.items.map((it,i)=>it.at??(.12+.25*i));const n=p.items.length,W=220,gap=160,x0=540-(n*W+(n-1)*gap)/2,H=420,base=780;

       <div class="abs anton" style="left:0;top:4px;font-size:118px;color:${CORAL};line-height:1">${esc(r.v)}</div>
       <div class="abs anton" style="left:${r.w||220}px;top:30px;font-size:60px;color:#111013;white-space:nowrap">${esc(r.l)}</div>
       <svg class="abs" style="left:${(r.w||220)-12}px;top:92px;overflow:visible" width="560" height="40" viewBox="0 0 560 40"><path data-r="ul" d="M5 26 C150 12 320 34 ${Math.min(550,(r.l.length*30+40))} 18" stroke="${CORAL}" stroke-width="16" fill="none" stroke-linecap="round" opacity=".5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg></div>`).join("")}
    <div class="abs anton" data-r="st" style="right:-36px;top:-54px;border:10px solid ${CORAL};color:${CORAL};border-radius:20px;padding:2px 26px 8px;font-size:76px;background:#fff;transform-origin:50% 50%">${esc(p.stamp||"")}</div>`,
    `left:110px;top:${Math.max(40,(880-H)/2)}px;width:860px;height:${H}px;transform-origin:50% 100%`);
  const rw=[...card.querySelectorAll('[data-r=rw]')],ul=[...card.querySelectorAll('[data-r=ul]')],st=card.querySelector('[data-r=st]');
  const RT=rows.map((r,i)=>r.at??(.35+.45*i));const SA=p.stampAt??.3;
  RT.forEach((tt,i)=>burst({x:200,y:Math.max(40,(880-H)/2)+190+i*165+60,t0:tt,n:12,speed:500,colors:[CORAL,"#fff"],life:.45}));
  if(p.stamp)shake(SA+.2,.3,14);
  return t=>{const e=easeOut(t/.4);card.style.transform=`perspective(1600px) rotateX(${(1-e)*55}deg) rotate(${(1-e)*-6+wob(t,.4,1)}deg) translateY(${(1-e)*200+wob(t,.5,5)}px)`;card.style.opacity=fade(t,0,.12);
    rw.forEach((r,i)=>{const k=t-RT[i];r.style.opacity=clamp(k/.08);r.style.transform=`translateX(${(1-back(k/.35))*-160}px) scale(${k<.35?.85+.15*back(k/.35):1+.03*Math.max(0,1-(k-.35)/.3)})`;});
    ul.forEach((u,i)=>u.setAttribute("stroke-dashoffset",(100*(1-easeOut((t-RT[i]-.25)/.3))).toFixed(1)));
    if(st){const k=clamp((t-SA)/.2);st.style.opacity=k>0?1:0;st.style.transform=`rotate(${12+wob(t,.5,1.5)}deg) scale(${k<1?2.6-1.6*easeIn(k):1})`;}}};

/* ---------- invert: pantallazo coral con texto oscuro (1 por vídeo, el dato más fuerte) ----------
   p: lines[] (palabras entre * en blanco), size, step */
KINDS.invert=(p)=>{$("#stage").classList.add("inv");const fs=p.size||140;const lines=p.lines||[];
  const rays=el(`<svg width="1800" height="1800" viewBox="-900 -900 1800 1800">${[...Array(18)].map((_,i)=>{const a=i/18*Math.PI*2,b=a+Math.PI/18;
     return `<path d="M0 0 L${(Math.cos(a)*1300).toFixed(0)} ${(Math.sin(a)*1300).toFixed(0)} L${(Math.cos(b)*1300).toFixed(0)} ${(Math.sin(b)*1300).toFixed(0)} Z" fill="#111013" opacity=".08"/>`}).join("")}</svg>`,
     "left:-360px;top:-480px;width:1800px;height:1800px;transform-origin:50% 50%");
  const top0=p.top??Math.max(30,420-lines.length*fs*.55);
  const ln=lines.map((l,i)=>el(`<div class="anton" style="font-size:${fs}px;text-align:center;width:1040px;color:#111013">${l.split("*").map((s,j)=>j%2?`<span style="color:#fff">${chars(s)}</span>`:chars(s)).join("")}</div>`,`left:20px;top:${top0+i*fs*1.05}px;width:1040px;transform-origin:50% 60%`));
  const lc=ln.map(e=>[...e.querySelectorAll(".ch")]);
  shake(.04,.4,24);burst({x:540,y:430,t0:.04,n:32,speed:950,colors:["#111013","#fff"],shape:"spark",grav:200,life:.6});
  return t=>{rays.style.transform=`rotate(${t*16}deg) scale(${1+.05*Math.sin(t*3)})`;
    lc.forEach((c,i)=>popChars(c,t,.04+i*(p.step??.22),.025,.28));
    ln.forEach((e,i)=>e.style.transform=`translateY(${wob(t,.5,6,i)}px) rotate(${wob(t,.4,1.2,i)}deg) scale(${1+.025*Math.sin(t*5+i)})`);
    const f=$("#flash");f.style.background="#fff";f.style.mixBlendMode="normal";f.style.opacity=(t<.16?.75*(1-t/.16):0).toFixed(3);}};

/* ---------- split: pantalla partida con dos Tonis y veredicto ----------
   p: a{label,toni,o,good}, b{label,toni,o,good}, bdelay, verdict, size */
KINDS.split=(p)=>{const T=window.RepeToni;const A=p.a||{},B=p.b||{};const bd=p.bdelay??.35,vd=p.verdict??1.0;const ag=!!A.good,bg=B.good!==false;
  const box=el(`<svg width="1080" height="880" viewBox="0 0 1080 880" overflow="visible">
    <g data-r="pa"><rect x="20" y="0" width="500" height="870" rx="34" fill="#1c1a20" data-r="ra" stroke="${CORAL}" stroke-width="0"/><g transform="translate(270 820) scale(.78)"><ellipse cx="0" cy="4" rx="170" ry="20" fill="#000" opacity=".45"/><g data-r="ta"></g></g></g>
    <g data-r="pb"><rect x="560" y="0" width="500" height="870" rx="34" fill="#1c1a20" data-r="rb" stroke="${CORAL}" stroke-width="0"/><g transform="translate(810 820) scale(.78)"><ellipse cx="0" cy="4" rx="170" ry="20" fill="#000" opacity=".45"/><g data-r="tb"></g></g></g>
    <path data-r="dv" d="M565 -30 L515 900" stroke="${CORAL}" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>`,"left:0;top:0;width:1080px;height:880px");
  const g=k=>box.querySelector(`[data-r=${k}]`);const pa=g("pa"),pb=g("pb"),dv=g("dv"),ra=g("ra"),rb=g("rb");
  const ia=T.create({view:"front",standalone:false}),ib=T.create({view:"front",standalone:false});g("ta").appendChild(ia.g);g("tb").appendChild(ib.g);
  const fs=p.size||84;
  const la=el(`<div class="anton" style="font-size:${fs}px;text-align:center;width:500px">${chars(A.label||"")}</div>`,"left:20px;top:26px;width:500px");
  const lb=el(`<div class="anton coral" style="font-size:${fs}px;text-align:center;width:500px">${chars(B.label||"")}</div>`,"left:560px;top:26px;width:500px");
  const lac=[...la.querySelectorAll(".ch")],lbc=[...lb.querySelectorAll(".ch")];
  const ma=el(`<div style="width:160px;height:160px"></div>`,"left:190px;top:128px;width:160px;height:160px"),mb=el(`<div style="width:160px;height:160px"></div>`,"left:730px;top:128px;width:160px;height:160px");
  const mka=placeIcon(ma.firstElementChild,ag?"check":"cross",{},vd),mkb=placeIcon(mb.firstElementChild,bg?"check":"cross",{},vd+.25);
  if(!ag)shake(vd+.34,.3,14);if(bg)burst({x:810,y:210,t0:vd+.55,n:18,colors:[CORAL,"#fff"],speed:600});
  return t=>{const ka=easeOut(t/.3),kb=easeOut((t-bd)/.3);
    pa.setAttribute("transform",`translate(${(-620*(1-ka)).toFixed(1)} 0)`);pb.setAttribute("transform",`translate(${(620*(1-kb)).toFixed(1)} 0)`);
    la.style.transform=`translateX(${-620*(1-ka)}px)`;lb.style.transform=`translateX(${620*(1-kb)}px) rotate(${wob(t,.6,1.2)}deg)`;lb.style.opacity=fade(t,bd,.1);
    popChars(lac,t,.12,.03,.28);popChars(lbc,t,bd+.12,.03,.28);
    dv.setAttribute("stroke-dashoffset",(100*(1-easeOut((t-.1)/.3))).toFixed(1));
    ia.set(T.pose(A.toni||"shrug",t,Object.assign({talk:false},A.o||{})));ib.set(T.pose(B.toni||"flexDouble",Math.max(0,t-bd),Object.assign({hold:9,talk:false},B.o||{})));
    mka(t);mkb(t);
    const dimA=!ag?.45*fade(t,vd+.35,.3):0,dimB=!bg?.45*fade(t,vd+.6,.3):0;pa.setAttribute("opacity",(1-dimA).toFixed(2));pb.setAttribute("opacity",(1-dimB).toFixed(2));
    ra.setAttribute("stroke-width",ag&&t>vd+.3?8:0);rb.setAttribute("stroke-width",bg&&t>vd+.55?8:0);}};

/* ---------- reset de la escena invertida al cambiar de escena ---------- */
{const _bs=window.buildScene;window.buildScene=(i,st,D)=>{$("#stage").classList.remove("inv");const f=$("#flash");f.style.background="#FE594D";f.style.mixBlendMode="screen";return _bs(i,st,D);};}

/* ---------- chips con título opcional (p.title, p.titleSize) ---------- */
{const _ch=KINDS.chips;KINDS.chips=(p)=>{const u=_ch(p);if(!p.title)return u;
  const ttl=el(`<div class="anton" style="font-size:${p.titleSize||100}px;text-align:center;width:1040px">${p.title.split("*").map((s,i)=>i%2?`<span class="coral">${chars(s)}</span>`:chars(s)).join("")}</div>`,"left:20px;top:10px;width:1040px;transform-origin:50% 50%");
  const tc=[...ttl.querySelectorAll(".ch")];return t=>{u(t);popChars(tc,t,.02,.03,.28);ttl.style.transform=`rotate(${wob(t,.6,1.3)}deg) scale(${1+.02*Math.sin(t*4)})`;};};}

/* ================================================================ CATÁLOGO AMPLIADO v2 (12 nov 2026)
   Iconos anatómicos: glute, quad, hamstring (lima solo en el músculo) */
const LIMEC="#C8F135";
/* glúteo: vista de espalda, los dos glúteos se aprietan con pulso y arcos coral */
AN.glute=p=>({html:SVG(`<g data-k="g">
   <path d="M44 40 C70 30 130 30 156 40 L164 104 C164 120 150 128 140 128 L60 128 C50 128 36 120 36 104 Z" fill="#1c1a20"/>
   <path d="M64 128 L58 190 M136 128 L142 190 M100 120 L100 190" stroke-width="9"/>
   <g data-k="l"><path d="M100 62 C80 52 50 60 48 92 C46 120 72 134 98 122 Z" fill="${LIMEC}" stroke="#111013" stroke-width="6"/></g>
   <g data-k="r"><path d="M100 62 C120 52 150 60 152 92 C154 120 128 134 102 122 Z" fill="${LIMEC}" stroke="#111013" stroke-width="6"/></g>
   <path d="M44 40 C70 30 130 30 156 40" stroke-width="9"/></g>
   <g data-k="pw" stroke="${CORAL}" stroke-width="8" opacity="0"><path d="M24 70 C14 84 14 100 24 114"/><path d="M176 70 C186 84 186 100 176 114"/></g>`),
  init(r){this.g=q(r,"g");this.l=q(r,"l");this.r=q(r,"r");this.pw=q(r,"pw")},
  upd(t){const s=pop(t,0,.4);tf(this.g,`translate(100 110) scale(${s}) translate(-100 -110)`);
    const sq=Math.max(0,Math.sin(t*5));const k=1+.1*sq;
    tf(this.l,`translate(${(4*sq).toFixed(1)} 0) translate(74 94) scale(${k.toFixed(3)}) translate(-74 -94)`);
    tf(this.r,`translate(${(-4*sq).toFixed(1)} 0) translate(126 94) scale(${k.toFixed(3)}) translate(-126 -94)`);
    this.pw.setAttribute("opacity",(t>.3?sq:0).toFixed(2));tf(this.pw,`translate(100 92) scale(${(1+.12*sq).toFixed(3)}) translate(-100 -92)`)}});
/* cuádriceps: muslo de lado, la pierna se extiende (como en la máquina) y el músculo se hincha */
AN.quad=p=>({html:SVG(`<g data-k="g">
   <path d="M30 70 C30 56 46 50 58 52 L148 82 C160 86 164 104 152 112 L60 102 C40 100 30 86 30 70 Z" fill="#1c1a20"/>
   <g data-k="m"><path d="M52 58 C84 54 128 70 146 86 C128 92 86 90 54 82 C44 76 44 62 52 58 Z" fill="${LIMEC}" stroke="#111013" stroke-width="6"/></g>
   <path d="M30 70 C30 56 46 50 58 52 L148 82 C160 86 164 104 152 112 L60 102 C40 100 30 86 30 70 Z" stroke-width="9"/>
   <g data-k="sh"><path d="M150 98 L150 176" stroke-width="20"/><path d="M150 176 L176 180" stroke-width="16"/></g>
   <circle cx="150" cy="98" r="15" fill="#fff" stroke="none"/></g>`),
  init(r){this.g=q(r,"g");this.m=q(r,"m");this.sh=q(r,"sh")},
  upd(t){const s=pop(t,0,.4);tf(this.g,`translate(100 110) scale(${s}) translate(-100 -110)`);
    const e=.5-.5*Math.cos(clamp(t-.2,0,99)*3.4);tf(this.sh,`rotate(${(-82*e).toFixed(1)} 150 98)`);
    const k=1+.13*e;tf(this.m,`translate(98 74) scale(1 ${k.toFixed(3)}) translate(-98 -74)`)}});
/* femoral: muslo de lado, la pierna se dobla hacia atrás (curl femoral) y el músculo de detrás se hincha */
AN.hamstring=p=>({html:SVG(`<g data-k="g">
   <path d="M76 20 C96 16 118 22 122 36 L118 126 C116 138 92 140 86 128 L70 40 C68 30 70 22 76 20 Z" fill="#1c1a20"/>
   <g data-k="m"><path d="M78 34 C70 60 72 100 86 124 C92 112 96 70 92 36 Z" fill="${LIMEC}" stroke="#111013" stroke-width="6"/></g>
   <path d="M76 20 C96 16 118 22 122 36 L118 126 C116 138 92 140 86 128 L70 40 C68 30 70 22 76 20 Z" stroke-width="9"/>
   <g data-k="sh"><path d="M102 128 L102 188" stroke-width="20"/><path d="M102 188 L128 190" stroke-width="16"/></g>
   <circle cx="102" cy="128" r="15" fill="#fff" stroke="none"/></g>`),
  init(r){this.g=q(r,"g");this.m=q(r,"m");this.sh=q(r,"sh")},
  upd(t){const s=pop(t,0,.4);tf(this.g,`translate(100 110) scale(${s}) translate(-100 -110)`);
    const e=.5-.5*Math.cos(clamp(t-.2,0,99)*3.4);tf(this.sh,`rotate(${(95*e).toFixed(1)} 102 128)`);
    const k=1+.16*e;tf(this.m,`translate(84 80) scale(${k.toFixed(3)} 1) translate(-84 -80)`)}});
</script></body></html>
